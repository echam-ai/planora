name: CI

on: push

permissions:
  contents: read

# Two independent jobs, no `needs:`: a failure in one still reports the other.
jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test:coverage
      - name: Build
        run: bun run build
      - name: Check generated API types are up to date
        run: |
          bun run gen:api-types
          git diff --exit-code -- src/shared/api/schema.gen.ts

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          working-directory: apps/api
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest --cov --cov-fail-under=80
      - name: Check OpenAPI contract is up to date
        run: |
          uv run python -m planora_api.openapi
          git diff --exit-code -- openapi.json
