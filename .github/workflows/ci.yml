name: CI

on: push

permissions:
  contents: read

# Independent jobs, no `needs:`: a failure in one still reports the other.
jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test:coverage
      - name: Build
        run: bun run build
      - name: Check generated routes are up to date
        run: git diff --exit-code -- src/routeTree.gen.ts
      - name: Check generated API types are up to date
        run: |
          bun run gen:api-types
          git diff --exit-code -- src/shared/api/schema.gen.ts
      # Chromium only: both e2e projects (desktop and Pixel 5) are Chromium.
      # The browser download is cached by lockfile hash; install always runs
      # so `--with-deps` still installs the system packages on a cache hit
      # (the browser download itself is skipped when already cached).
      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/bun.lock') }}
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: E2E
        run: bun run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          # No python-version: apps/api/.python-version is the single source of
          # truth, read by setup-uv and by every `uv` command below.
          working-directory: apps/api
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest --cov --cov-fail-under=80
      - name: Check OpenAPI contract is up to date
        run: |
          uv run python -m planora_api.openapi
          git diff --exit-code -- openapi.json

  # The HTTP-mode smoke suite (#88): a real uvicorn API plus the web dev server
  # in HTTP mode, so it needs both toolchains. The Chromium install, browser
  # cache and failure report repeat the web job's steps exactly.
  e2e-http:
    name: E2E (HTTP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: apps/api
      - uses: oven-sh/setup-bun@v2.2.0
      - name: Install API dependencies
        run: uv sync --frozen
        working-directory: apps/api
      - name: Install web dependencies
        run: bun install --frozen-lockfile
        working-directory: apps/web
      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/bun.lock') }}
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - name: E2E (HTTP)
        run: bun run e2e:http
        working-directory: apps/web
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-http
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
